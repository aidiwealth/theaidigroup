# DigitalOcean App Platform spec.
# Create:  doctl apps create --spec .do/app.yaml
# Update:  doctl apps update <APP_ID> --spec .do/app.yaml
# Pages are prerendered at build time; the Node server adds security headers and redirects.
# Website forms are switched off, so no database or email secrets are needed yet.
# When forms return (via Aidi OS), add DATABASE_URL, DATABASE_CA, RESEND_API_KEY, TURNSTILE_SECRET,
# NUXT_PUBLIC_TURNSTILE_SITE_KEY and the FORMS_* settings, and point the health check at /api/health.
name: theaidigroup
region: nyc
domains:
  - domain: theaidigroup.com
    type: PRIMARY
  - domain: www.theaidigroup.com
    type: ALIAS
ingress:
  rules:
    - match:
        authority:
          exact: www.theaidigroup.com
        path:
          prefix: /
      redirect:
        authority: theaidigroup.com
        redirect_code: 301
    - match:
        path:
          prefix: /
      component:
        name: web
services:
  - name: web
    github:
      repo: aidiwealth/theaidigroup
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm ci && npm run build
    run_command: node .output/server/index.mjs
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /api/ping
    envs:
      - { key: NODE_ENV, value: production }
      - { key: PORT, value: "8080" }
